<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot Explorer Hero</title>
<style>
  :root { --bg: #0b0f0d; }
  html, body { margin: 0; background: var(--bg); }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1040" height="1240"></canvas>
<script>
// BetPig — Shot Explorer hero motion.
// Deterministic: render(t) draws the frame at time t (seconds), so the same
// page plays live in a browser and is captured frame-by-frame by render.mjs.
(() => {
  // ?w=&h= set the render size in device pixels (default: 1040x1240 portrait hero slot)
  const params = new URLSearchParams(location.search);
  const W = Number(params.get('w')) || 1040, H = Number(params.get('h')) || 1240;
  const DURATION = 12;           // seconds, loops seamlessly
  const LIME = [166, 243, 107];  // #A6F36B
  const BG = '#0b0f0d';
  const cvs = document.getElementById('c');
  cvs.width = W; cvs.height = H;
  cvs.style.width = W / 2 + 'px'; cvs.style.height = H / 2 + 'px';
  const ctx = cvs.getContext('2d');

  // ---------- seeded random ----------
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return (u - 3) / 1.2; };

  // ---------- easing ----------
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const outBack = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  // ---------- court geometry (feet). x: sideline-to-sideline, z: from baseline, y: up ----------
  const HOOP = { x: 0, y: 10, z: 5.25 };
  const arcPts = (cx, cz, r, a0, a1, n = 64) => {
    const p = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([cx + r * Math.cos(a), 0, cz + r * Math.sin(a)]); }
    return p;
  };
  const threeA = Math.asin(22 / 23.75);
  const threeZ = HOOP.z + 23.75 * Math.cos(threeA);
  const lines = [
    { pts: [[-25, 0, 0], [25, 0, 0], [25, 0, 47], [-25, 0, 47], [-25, 0, 0]], w: 1 },        // boundary
    { pts: [[-8, 0, 0], [-8, 0, 19], [8, 0, 19], [8, 0, 0]], w: 0.9 },                        // paint
    { pts: arcPts(0, 19, 6, Math.PI, 0), w: 0.8 },                                            // FT circle (far half)
    { pts: arcPts(0, 19, 6, 0, Math.PI), w: 0.8, dash: true },                                // FT circle (near half, dashed)
    { pts: [[-22, 0, 0], [-22, 0, threeZ], ...arcPts(0, HOOP.z, 23.75, Math.PI / 2 + threeA, Math.PI / 2 - threeA, 96), [22, 0, threeZ], [22, 0, 0]], w: 0.95 },
    { pts: arcPts(0, HOOP.z, 4, 0, Math.PI, 32), w: 0.6 },                                    // restricted area
    { pts: arcPts(0, 47, 6, Math.PI, 2 * Math.PI, 48), w: 0.85 },                             // centre circle
  ];
  // lane hash marks
  for (const z of [7, 8, 11, 14]) for (const s of [-1, 1]) lines.push({ pts: [[s * 8, 0, z], [s * 8.9, 0, z]], w: 0.6 });

  // ---------- shots ----------
  const shots = [];
  const N = 180;
  const zone = () => {
    const r = rnd();
    if (r < 0.34) { // at the rim
      const a = Math.PI * rnd(), d = 1.5 + Math.abs(gauss()) * 3.2;
      return { x: d * Math.cos(a), z: HOOP.z + d * Math.sin(a) + 0.4, p: 0.64 };
    }
    if (r < 0.52) { // paint / short mid
      return { x: gauss() * 4.5, z: 9 + rnd() * 9, p: 0.46 };
    }
    if (r < 0.62) { // mid-range
      const a = 0.25 + rnd() * (Math.PI - 0.5), d = 12 + rnd() * 8;
      return { x: d * Math.cos(a), z: HOOP.z + d * Math.sin(a), p: 0.41 };
    }
    if (r < 0.74) { // corner threes
      const s = rnd() < 0.5 ? -1 : 1;
      return { x: s * (22.6 + rnd() * 1.6), z: 0.8 + rnd() * 11, p: 0.40 };
    }
    // above-the-break threes
    const a = Math.PI / 2 + (rnd() * 2 - 1) * (Math.PI / 2 - threeA), d = 24.3 + Math.abs(gauss()) * 1.6;
    return { x: d * Math.cos(a), z: HOOP.z + d * Math.sin(a), p: 0.37 };
  };
  // launch times accelerate: a few early shots, then a dense flurry
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1);
    const t0 = 0.9 + 7.6 * Math.pow(u, 0.62) + (rnd() - 0.5) * 0.12;
    const z = zone();
    const made = rnd() < z.p;
    const dist = Math.hypot(z.x - HOOP.x, z.z - HOOP.z);
    const miss = made ? [0, 0] : [(rnd() - 0.5) * 2.4, (rnd() - 0.2) * 2.0];
    shots.push({ t0, x: z.x, z: z.z, made, dist, miss, dur: 0.75 + dist * 0.017 });
  }
  shots.sort((a, b) => a.t0 - b.t0);

  // ---------- camera ----------
  const camAt = (t) => {
    // swing in from an angle, settle, drift, then swing back for the loop
    const inP = ease(t / 4.2), outP = ease((t - (DURATION - 1.4)) / 1.4);
    const k = inP * (1 - outP);
    const drift = Math.sin(t * 0.55) * 0.035 * k;
    return {
      yaw: -0.5 * (1 - k) + drift,
      pitch: 0.70 - 0.2 * (1 - k),
      dist: 74 - 8 * k,
      target: [0, 4.5, 22.5],
      focal: Math.min(W * 0.923, H * 0.84),
      cx: W / 2, cy: H * (W > H ? 0.5 : 0.55),
    };
  };
  const makeProj = (cam) => {
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const [tx, ty, tz] = cam.target;
    const eye = [tx + cam.dist * sy * cp, ty + cam.dist * sp, tz + cam.dist * cy * cp];
    // forward points from eye to target
    let f = [tx - eye[0], ty - eye[1], tz - eye[2]];
    const fl = Math.hypot(...f); f = f.map(v => v / fl);
    let r = [f[2], 0, -f[0]]; const rl = Math.hypot(...r); r = r.map(v => v / rl);  // right = f × up
    r = [-r[0], -r[1], -r[2]];
    const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    return ([x, y, z]) => {
      const d = [x - eye[0], y - eye[1], z - eye[2]];
      const cz = d[0] * f[0] + d[1] * f[1] + d[2] * f[2];
      const cx = d[0] * r[0] + d[1] * r[1] + d[2] * r[2];
      const cyv = d[0] * u[0] + d[1] * u[1] + d[2] * u[2];
      const s = cam.focal / cz;
      return [cam.cx + cx * s, cam.cy - cyv * s, s];
    };
  };

  // shot path: release at ~7ft, arc up and into the rim
  const shotPos = (s, k) => {
    const end = [HOOP.x + s.miss[0], HOOP.y + 0.2, HOOP.z + s.miss[1]];
    const start = [s.x, 7, s.z];
    const apex = 3 + s.dist * 0.24;
    return [
      start[0] + (end[0] - start[0]) * k,
      start[1] + (end[1] - start[1]) * k + apex * 4 * k * (1 - k),
      start[2] + (end[2] - start[2]) * k,
    ];
  };

  // ---------- drawing helpers ----------
  const strokePath = (P, pts, color, width, dash) => {
    ctx.beginPath();
    pts.forEach((p, i) => { const q = P(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.setLineDash(dash ? [10, 12] : []);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
    ctx.setLineDash([]);
  };
  const roundRect = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

  function drawFloorGlow(P, t, alpha) {
    const c = P([0, 0, 14]);
    const edge = P([24, 0, 14]);
    const rx = Math.abs(edge[0] - c[0]);
    ctx.save();
    ctx.translate(c[0], c[1]); ctx.scale(1, 0.48);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 1.15);
    g.addColorStop(0, rgba(LIME, 0.10 * alpha));
    g.addColorStop(0.55, rgba(LIME, 0.035 * alpha));
    g.addColorStop(1, rgba(LIME, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx * 1.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawCourt(P, alpha) {
    // faint floor fill
    ctx.beginPath();
    [[-25, 0, 0], [25, 0, 0], [25, 0, 47], [-25, 0, 47]].forEach((p, i) => { const q = P(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath(); ctx.fillStyle = `rgba(20,32,22,${0.35 * alpha})`; ctx.fill();
    ctx.save();
    ctx.shadowColor = rgba([190, 255, 170], 0.35 * alpha); ctx.shadowBlur = 10;
    for (const l of lines) strokePath(P, l.pts, `rgba(214,240,214,${0.62 * l.w * alpha})`, 2.6 * l.w, l.dash);
    ctx.restore();
  }

  function drawHoop(P, alpha, flash) {
    // stanchion shadow line + backboard + rim + net
    const bb = [[-3, 9, 4], [3, 9, 4], [3, 12.5, 4], [-3, 12.5, 4], [-3, 9, 4]];
    ctx.beginPath(); bb.forEach((p, i) => { const q = P(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.fillStyle = `rgba(16,26,18,${0.85 * alpha})`; ctx.fill();
    ctx.strokeStyle = `rgba(214,240,214,${0.7 * alpha})`; ctx.lineWidth = 2.4; ctx.stroke();
    strokePath(P, [[-1, 10, 4], [1, 10, 4], [1, 11.5, 4], [-1, 11.5, 4], [-1, 10, 4]], `rgba(214,240,214,${0.55 * alpha})`, 1.8);
    strokePath(P, [[0, 0, 4], [0, 9, 4]], `rgba(214,240,214,${0.10 * alpha})`, 1.5);
    // rim
    const rim = []; for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2; rim.push([HOOP.x + 0.75 * Math.cos(a), HOOP.y, HOOP.z + 0.75 * Math.sin(a)]); }
    ctx.save();
    ctx.shadowColor = rgba(LIME, 0.9); ctx.shadowBlur = 14 + 30 * flash;
    strokePath(P, rim, rgba(LIME, (0.75 + 0.25 * flash) * alpha), 3.2);
    ctx.restore();
    // net
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2;
      strokePath(P, [[0.75 * Math.cos(a), 10, HOOP.z + 0.75 * Math.sin(a)], [0.42 * Math.cos(a + 0.35), 8.6, HOOP.z + 0.42 * Math.sin(a + 0.35)]], rgba(LIME, 0.35 * alpha), 1.3);
    }
  }

  function drawUI(t, made, taken, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '500 26px Inter, system-ui, sans-serif';
    // player card
    roundRect(40, 44, 300, 150, 24);
    ctx.fillStyle = 'rgba(19,28,21,0.82)'; ctx.fill();
    ctx.strokeStyle = 'rgba(214,240,214,0.10)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#eef5ee'; ctx.font = '600 28px Inter, system-ui, sans-serif'; ctx.fillText('Example player', 68, 96);
    ctx.fillStyle = 'rgba(214,240,214,0.5)'; ctx.font = '400 20px Inter, system-ui, sans-serif'; ctx.fillText('Illustrative season', 68, 126);
    ctx.fillStyle = rgba(LIME, 1); ctx.beginPath(); ctx.arc(76, 162, 7, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(238,245,238,0.85)'; ctx.font = '500 20px Inter, system-ui, sans-serif'; ctx.fillText('Made', 92, 169);
    ctx.strokeStyle = rgba(LIME, 0.8); ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(172, 162, 6.5, 0, 7); ctx.stroke();
    ctx.fillText('Missed', 188, 169);

    // live tally
    const pct = taken ? (made / taken * 100).toFixed(1) : '0.0';
    const label = `${taken} attempts · ${pct}% FG`;
    ctx.font = '500 22px Inter, system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    roundRect(W - 40 - tw - 56, 44, tw + 56, 56, 28);
    ctx.fillStyle = 'rgba(19,28,21,0.82)'; ctx.fill(); ctx.strokeStyle = 'rgba(214,240,214,0.10)'; ctx.stroke();
    ctx.fillStyle = rgba(LIME, 1); ctx.beginPath(); ctx.arc(W - 40 - tw - 28, 72, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#eef5ee'; ctx.fillText(label, W - 40 - tw - 14, 80);

    // bottom pill
    const a = '3D court', b = 'Shot-by-shot replay';
    ctx.font = '500 22px Inter, system-ui, sans-serif';
    const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    const pw = wa + wb + 110, px = (W - pw) / 2, py = H - 104;
    roundRect(px, py, pw, 60, 30);
    ctx.fillStyle = 'rgba(19,28,21,0.88)'; ctx.fill(); ctx.strokeStyle = 'rgba(214,240,214,0.10)'; ctx.stroke();
    roundRect(px + 8, py + 8, wa + 40, 44, 22); ctx.fillStyle = rgba(LIME, 1); ctx.fill();
    ctx.fillStyle = '#0b0f0d'; ctx.fillText(a, px + 28, py + 38);
    ctx.fillStyle = 'rgba(238,245,238,0.75)'; ctx.fillText(b, px + wa + 76, py + 38);
    ctx.restore();
  }

  function render(t) {
    t = ((t % DURATION) + DURATION) % DURATION;
    const cam = camAt(t);
    const P = makeProj(cam);
    const fadeIn = ease(t / 0.8);
    const fadeOut = 1 - ease((t - (DURATION - 1.2)) / 1.1);
    const sceneA = fadeIn;           // court & hoop
    const dataA = fadeOut;           // shots clear before the loop restarts

    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    // ambient glow behind the court
    const g = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, W * 0.75);
    g.addColorStop(0, 'rgba(110,190,80,0.10)'); g.addColorStop(1, 'rgba(110,190,80,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    drawFloorGlow(P, t, sceneA);
    drawCourt(P, sceneA);

    // shot markers on the floor
    let made = 0, taken = 0, flash = 0;
    const flying = [];
    for (const s of shots) {
      const dt = t - s.t0;
      if (dt < 0) continue;
      const k = dt / s.dur;
      if (k >= 1) taken++;
      if (k < 1) flying.push([s, k]);
      if (k >= 1 && s.made) made++;
      if (k >= 1 && k < 1.35) flash = Math.max(flash, (s.made ? 1 : 0.35) * (1 - (k - 1) / 0.35));
      const q = P([s.x, 0, s.z]);
      const pop = outBack(dt / 0.35);
      const resolved = k >= 1;
      const pulse = resolved ? Math.max(0, 1 - (k - 1) * s.dur / 0.5) : 0;
      const rad = (5.2 + 2.2 * (q[2] / 30)) * pop;
      ctx.save();
      ctx.globalAlpha = dataA;
      if (!resolved) {
        ctx.fillStyle = 'rgba(238,245,238,0.85)';
        ctx.beginPath(); ctx.arc(q[0], q[1], rad * 0.8, 0, 7); ctx.fill();
      } else if (s.made) {
        ctx.shadowColor = rgba(LIME, 0.95); ctx.shadowBlur = 16 + 26 * pulse;
        ctx.fillStyle = rgba(LIME, 1);
        ctx.beginPath(); ctx.arc(q[0], q[1], rad * (1 + 0.6 * pulse), 0, 7); ctx.fill();
        if (pulse > 0) { ctx.strokeStyle = rgba(LIME, 0.6 * pulse); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q[0], q[1], rad * (1 + 3.2 * (1 - pulse)), 0, 7); ctx.stroke(); }
      } else {
        ctx.strokeStyle = rgba(LIME, 0.55); ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(q[0], q[1], rad, 0, 7); ctx.stroke();
      }
      ctx.restore();
    }

    // faint arcs that linger after each shot, then flying balls with trails
    ctx.save();
    ctx.globalAlpha = dataA;
    for (const s of shots) {
      const k = (t - s.t0) / s.dur;
      if (k < 1 || k > 2.2) continue;
      const a = 0.16 * (1 - (k - 1) / 1.2);
      const pts = []; for (let i = 0; i <= 24; i++) pts.push(shotPos(s, i / 24));
      strokePath(P, pts, `rgba(214,240,214,${a})`, 1.4);
    }
    for (const [s, k] of flying) {
      const steps = 18, tail = 0.32;
      for (let i = 0; i < steps; i++) {
        const k0 = Math.max(0, k - tail * (1 - i / steps)), k1 = Math.max(0, k - tail * (1 - (i + 1) / steps));
        const a = P(shotPos(s, k0)), b = P(shotPos(s, k1));
        ctx.strokeStyle = `rgba(230,250,225,${0.55 * (i + 1) / steps})`; ctx.lineWidth = 0.6 + 2.2 * (i + 1) / steps;
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
      const b = P(shotPos(s, k));
      ctx.shadowColor = 'rgba(240,255,230,0.9)'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#f4fff0'; ctx.beginPath(); ctx.arc(b[0], b[1], 4.6, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();

    drawHoop(P, sceneA, flash * dataA);
    drawUI(t, made, taken, sceneA * dataA + (1 - dataA) * 0.999 * sceneA);
  }

  window.HERO = { render, DURATION, W, H };
  if (!params.has('capture')) {
    const start = performance.now();
    const loop = (now) => { render((now - start) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
})();
</script>
</body>
</html>
